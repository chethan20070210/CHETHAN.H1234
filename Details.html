<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Customer Details</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f4f4f4;
            padding: 20px;
        }

        .form-container {
            width: 100%;
            max-width: 500px;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
        }

        h1 {
            text-align: center;
            color: #003366;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 6px;
            font-weight: bold;
            color: #333;
        }

        input,
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
        }

        textarea {
            height: 90px;
            resize: none;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 13px;
            border: none;
            border-radius: 25px;
            background: #003366;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #FFD700;
            color: #000;
        }

        #success {
            display: none;
            text-align: center;
            padding: 20px;
        }

        #success h2 {
            color: #008000;
            margin-bottom: 10px;
        }

        #success p {
            color: #555;
            line-height: 1.6;
        }
    </style>
</head>

<body>

<div class="form-container">

    <div id="formSection">

        <h1>Get in Touch</h1>

        <p class="subtitle">
            Enter your details and our team will contact you.
        </p>

        <form onsubmit="submitDetails(event)">

            <label for="name">Full Name</label>
            <input
                type="text"
                id="name"
                placeholder="Enter your name"
                required
            >

            <label for="email">Email Address</label>
            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                required
            >

            <label for="phone">Phone Number</label>
            <input
                type="tel"
                id="phone"
                placeholder="Enter your phone number"
                required
            >

            <label for="address">Address</label>
            <textarea
                id="address"
                placeholder="Enter your address"
                required
            ></textarea>

            <button type="submit">
                Submit Details
            </button>

        </form>

    </div>


    <div id="success">

        <h2>✅ Thank You!</h2>

        <p>
            Your details have been submitted successfully.
        </p>

        <p>
            Our team will contact you soon regarding your selected car.
        </p>

    </div>

</div>


<script>

function submitDetails(event) {

    event.preventDefault();

    // Get user details
    let name = document.getElementById("name").value;
    let email = document.getElementById("email").value;
    let phone = document.getElementById("phone").value;
    let address = document.getElementById("address").value;

    // Store details
    localStorage.setItem("name", name);
    localStorage.setItem("email", email);
    localStorage.setItem("phone", phone);
    localStorage.setItem("address", address);

    // Hide form
    document.getElementById("formSection").style.display = "none";

    // Show success message
    document.getElementById("success").style.display = "block";
}

</script>

</body>
</html>
